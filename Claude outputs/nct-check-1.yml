name: NCT Appointment Check

on:
  schedule:
    - cron: "7 * * * *"   # every hour, 7 minutes past — avoids the top-of-hour
                          # congestion that makes GitHub delay/drop "0 * * * *" runs
  workflow_dispatch: {}    # lets you trigger it manually to test

# Needed so this workflow can commit docs/centres.json back to the repo
# whenever the live list of NCT centres changes.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # playwright's --with-deps pulls OS packages via apt, including from
          # Google's Chrome repo — that occasionally serves a stale/mismatched
          # index mid-refresh (a transient blip on their end, not ours), which
          # fails the whole job. Retry a few times before giving up.
          for i in 1 2 3; do
            playwright install --with-deps chromium && break
            echo "playwright install failed (attempt $i/3) — retrying in 15s..."
            sleep 15
          done

      - name: Run checker
        env:
          NCT_REG: ${{ secrets.NCT_REG }}
          NCT_REGS: ${{ secrets.NCT_REGS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
        run: python nct_checker.py

      - name: Upload failure debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-failure-${{ github.run_id }}
          path: |
            debug_failure.png
            debug_failure.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit updated centre list, availability and last-checked time (if changed)
        run: |
          if ! git diff --quiet -- docs/centres.json docs/last_checked.json docs/availability.json; then
            git config user.name "nct-checker-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/centres.json docs/last_checked.json docs/availability.json
            git commit -m "Update centres.json / availability.json / last_checked.json"
            git push
          else
            echo "centres.json, availability.json and last_checked.json unchanged"
          fi

      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "$NTFY_TOPIC" ]; then
            curl -s -X POST "https://ntfy.sh/$NTFY_TOPIC" \
              -H "Title: NCT checker FAILED" \
              -H "Priority: urgent" \
              -d "The hourly NCT checker failed — availability alerts may have stopped. Check the log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            echo "NTFY_TOPIC secret not set — skipping failure alert. Set it as a repo secret (Settings > Secrets and variables > Actions) to get notified when this breaks."
          fi
