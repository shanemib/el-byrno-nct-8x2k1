name: Process New Signups

on:
  schedule:
    # Every 10 minutes, offset from the round 10-minute marks (:00, :10, :20…)
    # for the same reason nct-check.yml's schedule is offset — GitHub's own
    # scheduled-workflow queue gets more congested at round-number marks,
    # since huge numbers of repos across all of GitHub schedule jobs there.
    # That offset alone doesn't fully fix GitHub's native `schedule` trigger
    # being unreliable (the same well-documented limitation worked around
    # for nct-check.yml) — this workflow now also has its own cron-job.org
    # backup ping hitting workflow_dispatch (same pattern as nct-check.yml's,
    # just pointed at process-signups.yml/dispatches instead), which is what
    # actually keeps runs frequent and consistent. See SETUP.md "Fixing
    # unreliable hourly runs" if that backup ping ever needs recreating
    # (e.g. after rotating the GitHub token it uses).
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch: {}

# actions:read - so the failure-streak check below can read this
# workflow's own recent run history via the GitHub API (same setup as
# nct-check.yml).
permissions:
  actions: read

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Send verification emails for new signups
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: python process_signups.py

      - name: Check failure streak and alert if needed
        # Only runs when the step above failed. Same script and thresholds
        # as nct-check.yml (3 in a row, or 30% of the last 10 runs) — a
        # single failed run doesn't email you. This workflow has no browser
        # step, so there's no debug screenshot to attach here, just the
        # error line from the log.
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKFLOW_FILE: process-signups.yml
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python check_failure_streak.py
